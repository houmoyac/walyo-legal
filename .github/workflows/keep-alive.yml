# Pings the Walyo API every 10 minutes so the free Render server does not
# fall asleep (it sleeps after ~15 min without a request).
name: keep-alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: curl -sS -m 120 --retry 2 --retry-delay 5 https://walyo-api.onrender.com/health
